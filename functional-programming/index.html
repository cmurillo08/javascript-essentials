<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
        }
        select {
            padding: 10px;
            font-size: 16px;
            margin: 20px 0;
        }
        p {
            color: #666;
        }
        .section {
            margin-top: 30px;
            padding: 15px;
            background-color: #f5f5f5;
            border-left: 4px solid #007acc;
        }
        .section h3 {
            margin-top: 0;
            color: #007acc;
        }
        #descriptionContent, #codeContent {
            line-height: 1.6;
        }
        pre {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>JavaScript Essentials - Functional Programming Exercises</h1>
    <p>Select an exercise and open the browser console (Cmd+Option+I) to see the output</p>

    <select onchange="runExercise(this.value)">
        <option value="">-- Choose an Exercise --</option>
        <option value="1">Exercise 1: Pure functions</option>
        <option value="2">Exercise 2: Higher order functions</option>
        <option value="3">Exercise 3: Avoid mutability</option>
        <option value="4">Exercise 4: Recursion</option>
        <option value="5">Exercise 5: Currying</option>
        <option value="6">Exercise 6: Partial application</option>
        <option value="7">Exercise 7: Function composition</option>
        <option value="8">Exercise 8: IIFE</option>
        <option value="9">Exercise 9: Hoisting</option>
        <option value="10">Exercise 10: Type Coercion</option>
        <option value="11">Exercise 11: Closures</option>
    </select>

    <div id="descriptionSection" class="section" style="display: none;">
        <h3>Description</h3>
        <div id="descriptionContent"></div>
    </div>

    <div id="codeSection" class="section" style="display: none;">
        <h3>Code Examples</h3>
        <div id="codeContent"></div>
    </div>

    <script src="exercises.js"></script>
    <script>
        function runExercise(exerciseNum) {
            if (exerciseNum) {
                const functionName = `exercise${exerciseNum}`;
                if (typeof window[functionName] === 'function') {
                    window[functionName]();
                }
                
                // Show description and code sections
                const descFunctionName = `exercise${exerciseNum}Desc`;
                
                if (typeof window[descFunctionName] === 'function') {
                    document.getElementById('descriptionContent').innerHTML = window[descFunctionName]();
                    document.getElementById('descriptionSection').style.display = 'block';
                }
            
                document.getElementById('codeContent').innerHTML = `<pre>${window[functionName].toString()}</pre>`;
                document.getElementById('codeSection').style.display = 'block';
            } else {
                document.getElementById('descriptionSection').style.display = 'none';
                document.getElementById('codeSection').style.display = 'none';
            }
        }
    </script>
</body>
</html>
